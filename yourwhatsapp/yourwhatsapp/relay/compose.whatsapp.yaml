# Compose override that adds the WhatsApp relay next to a frappe_docker stack.
# Use:  docker compose -f compose.yaml -f overrides/compose.mariadb.yaml ... -f compose.whatsapp.yaml up -d
# See DEPLOYMENT.md. Never publish the relay port: only Frappe containers may reach it.
services:
  whatsapp-relay:
    image: ghcr.io/<org>/yourwhatsapp-relay:<version>
    # build:
    #   context: ./apps/yourwhatsapp/yourwhatsapp/yourwhatsapp/relay
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      # The relay boots unclaimed and is claimed from WhatsApp Settings -> Connect Relay.
      # Required in production: a bootstrap token, so only someone holding it can claim the relay.
      # Generate: python3 -c "import secrets;print(secrets.token_urlsafe(32))"
      RELAY_BOOTSTRAP_TOKEN: ${RELAY_BOOTSTRAP_TOKEN:-}
      RELAY_HOST: 0.0.0.0
      # Optional fallbacks, used only in env mode (RELAY_API_KEY set). A claimed relay
      # takes its callback URL and Host from the claim instead.
      # FRAPPE_BASE_URL: http://frontend:8080
      # FRAPPE_SITE_NAME: ${SITE_NAME}
      # Legacy/env mode: pins the key in env and disables claiming (must equal
      # WhatsApp Settings.relay_api_key).
      # RELAY_API_KEY: ${RELAY_API_KEY:?set RELAY_API_KEY}
    volumes:
      - whatsapp-relay-data:/data

volumes:
  whatsapp-relay-data:
